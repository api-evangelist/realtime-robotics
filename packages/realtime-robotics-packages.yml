description: >-
  Realtime Robotics publishes no package on any public registry. Searched npm, PyPI,
  RubyGems, crates.io, NuGet, Maven Central, pkg.go.dev and Packagist for rtr,
  realtimerobotics, rapidplan, pythoncommander and rtr-controller - every lookup 404s.
  What it does publish is source-distributed: first-party client libraries for the
  Realtime Controller ASCII API in Python, C# and CODESYS structured text, all inside
  one archived GitHub repository, plus versioned connector installers for the Resolver
  cloud service distributed through the application itself.
