name: Realtime Robotics rate limits
description: >-
  No rate limits, quotas, throttles or backoff signals are published for any Realtime
  Robotics surface. The ASCII API reference documents request formation rules, response
  classes, a request-size ceiling and ordering guarantees in detail, but says nothing
  about request rate; the RapidSense REST reference documents status codes per endpoint
  with no 429 and no RateLimit headers; and the Resolver Cloud REST API is not yet
  publicly available, so it has no published limits either.
limit_count: 0
