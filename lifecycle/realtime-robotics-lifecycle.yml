name: Realtime Robotics API lifecycle
description: >-
  Versioning, release and support posture across the RapidPlan/RapidSense on-premise
  stack and the Resolver cloud application. Realtime Robotics versions documentation
  per release rather than versioning an API endpoint, and keeps every historical
  version's documentation online.
versioning:
  scheme_rapidplan: MAJOR.MINOR(.PATCH) tied to the RapidPlan product release
  scheme_resolver: calendar versioning, YYYY.MM.DD
  current_rapidplan: 2.10.1
  current_rapidplan_docs_note: >-
    RapidPlan 2.10.1 explicitly shares the same user documentation as RapidPlan 2.9.
  current_resolver: 2026.08.24
  current_resolver_connectors:
    process_simulate_connector: 1.26.0
    visual_components_connector: 1.22.0
    melsoft_gemini_connector: 1.22.0
  in_url: false
  version_header: none
  documented_versions:
  - '2.1'
  - '2.2'
  - '2.3'
  - '2.4'
  - '2.5'
  - '2.6'
  - '2.7'
  - '2.9'
  - '2.10.1'
  note: >-
    Each RapidPlan version has its own ASCII API reference page, and every one of them
    stays published - eight historical ASCII API references are live alongside 2.9. The
    2.0 rewrite is documented as a breaking change from 1.x (commands renamed, request
    syntax moved to inline YAML); every 2.x change since is documented as additive, with
    a stated design goal that new optional arguments carry defaults so existing client
    code keeps working.
backwards_compatibility:
  stated_policy: >-
    "Inline YAML allows the API to be more easily backwards compatible. When arguments
    are added in the future, they will have a default value, so that existing code will
    remain functional on newer software versions."
  source: https://realtimerobotics.atlassian.net/wiki/spaces/rapidplandocs/pages/3467120890/2.9+Realtime+Robotics+RapidPlan+ASCII+API
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  observed_removals:
  - command: MultiRobotMove
    removed_in: '2.6'
    announced: 2023-11-29 in the ASCII API revision history
    notice_period: none stated
  note: >-
    Removals are recorded in the ASCII API page's own revision history, but there is no
    deprecation policy, no notice period, and no RFC 8594 Sunset/Deprecation signalling.
    A superseded RapidPlan version's documentation is moved under "Older Software
    Releases" rather than deleted.
