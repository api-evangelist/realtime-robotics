aid: realtime-robotics
name: Realtime Robotics
description: 'Realtime Robotics is a Boston-based industrial robotics software company
  that builds collision-free autonomous motion planning for multi-robot workcells.
  Its products are RapidPlan (the RapidPlan Create offline programming tool plus the
  on-premise Realtime Controller that plans and deconflicts robot motion at runtime),
  RapidSense (a sensor/perception layer that adds dynamic collision avoidance, volumes,
  markers and change detection), and Resolver (a cloud application that optimises
  cell layout and cycle time from simulation projects exported through Process Simulate,
  Visual Components and MELSOFT Gemini connectors). Its integration surface is machine-facing
  rather than web-facing: an inline-YAML ASCII command API over a TCP socket to the
  Realtime Controller, a REST interface for RapidSense, PROFINET and CC-Link IE Field
  Basic fieldbus interfaces for PLCs, and a published JSON Schema for the Resolver
  Operations Query. A public Resolver Cloud REST API is documented as under development
  and not yet publicly available.'
