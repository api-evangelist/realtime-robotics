- aid: realtime-robotics:resolver-cloud
  name: Resolver Cloud
  description: 'Resolver is Realtime Robotics'' cloud optimisation application, reached
    at app.resolver.rtr.ai (global) and app-eu.resolver.rtr.ai (Europe). Work is submitted
    as a .zip study containing a project.yaml workcell description, a cad/ folder and
    an optional queries.json; Realtime Robotics publishes a JSON Schema for the queries.json
    Operations Query and a written specification for project.yaml (rtr_yaml_version
    4.2.0). The application''s own /api surface is an authenticated AWS API Gateway
    (anonymous requests answer 403 Missing Authentication Token) and the documentation
    states plainly that the public REST API is under development and not yet publicly
    available.'
  humanURL: https://resolver.rtr.ai/docs/api/overview/
  baseURL: https://app.resolver.rtr.ai/api
  tags:
