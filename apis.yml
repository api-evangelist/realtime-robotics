- aid: realtime-robotics:rapidsense-api
  name: RapidSense API
  description: 'RapidSense 2.x exposes a REST interface on port 11235 of the Realtime
    Controller alongside equivalent ASCII commands. Documented resources are /volumes
    (GET, POST, PUT, DELETE - cuboid perception volumes), /markers and /markers/{id}
    (GET, POST, PUT, PATCH, DELETE - AprilTag 36h11 calibration markers), /sensors,
    /status (RapidSense version, state, per-sensor status and active 5xxx error codes),
    /heights (height-check filter query by centroid, width and length) and /changes,
    /changes/{id}, /changes/{id}/objects (change-detection filters, marked under development).
    No OpenAPI is published for it.'
  humanURL: https://realtimerobotics.atlassian.net/wiki/spaces/rapidplandocs/pages/3467120157/2.9+RapidSense+API
  baseURL: http://{rapidsense_host}:11235
