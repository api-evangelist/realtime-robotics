  date: '2024-10-01'
  product: RapidPlan
  url: https://realtimerobotics.atlassian.net/wiki/spaces/rapidplandocs/pages/3467116725/RapidPlan+2.9+Release+Notes
  breaking: false
  additions:
  - Native control for Fanuc and ABB robots.
  - RPCreate REST API for automating editing tasks in RapidPlan Create.
  - New PROFINET command module IO mapping (SetMaxLinearAccel, SetMaxLinearSpeed,
