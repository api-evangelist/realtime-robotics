  - 'ASCII API: offset argument on Reparent, collision_check_rapidsense on Move,
    clarified HoldMove/ResumeMove, updated epsilon_lin and epsilon_rot on IsOnTarget.'
  known_issues:
  - CancelMove error 7005 on paths with many edges (RAPID-50487).
  - ABB ERROR_ON_SPLINE_WATCHDOG_ERROR deviation of up to 4 cm on large low-accuracy motions.
